<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Art City · Garson</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0c13;--panel:#16131d;--card:#1d1826;--card2:#241d30;
  --cream:#F7EEE2;--amber:#FF8A1E;--red:#F0341C;--green:#22c55e;
  --gold:#FFC93C;--blue:#38bdf8;--line:rgba(255,220,180,.10);--muted:rgba(247,238,226,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--cream);min-height:100vh;padding-bottom:80px}
button{font-family:inherit;cursor:pointer;border:none}

.header{padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:40}
.header .title{font-family:'Bebas Neue';font-size:24px;letter-spacing:1px;color:var(--cream)}
.header .garson-name{font-size:13px;color:var(--gold);font-weight:700;background:rgba(255,201,60,.12);padding:5px 12px;border-radius:20px;border:1px solid rgba(255,201,60,.3)}

.zones{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none}
.zone{padding:8px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--cream);font-size:13px;font-weight:700;white-space:nowrap}
.zone.active{background:linear-gradient(135deg,var(--amber),var(--red));border-color:transparent;color:#fff}

.tables{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}
.table{position:relative;aspect-ratio:1/.9;background:var(--card);border:1.5px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.table:active{transform:scale(.97)}
.table.dolu{background:linear-gradient(150deg,#3a1a12,#2a1420);border-color:var(--red)}
.table .tn{font-family:'Bebas Neue';font-size:22px;letter-spacing:.5px}
.table .ta{font-size:12px;color:var(--gold);font-weight:700}
.table .empty{font-size:11px;color:var(--muted)}
.table .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--green)}
.table.dolu .dot{background:var(--red);box-shadow:0 0 6px var(--red)}
.table .sure-badge{position:absolute;top:6px;left:6px;font-size:9.5px;font-weight:700;background:rgba(0,0,0,.4);color:var(--gold);padding:2px 6px;border-radius:8px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:50;display:none;align-items:flex-end}
.modal.open{display:flex}
.modal-box{background:var(--panel);width:100%;max-height:88vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

.modal-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head .t{font-family:'Bebas Neue';font-size:24px}
.modal-head .sub{font-size:12px;color:var(--muted);margin-top:2px}

.existing-order{background:var(--card);margin:10px 16px 0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);max-height:110px;overflow-y:auto}
.existing-head{font-size:11px;font-weight:700;color:var(--gold);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.existing-line{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.05);color:var(--cream)}

.cat-scroll{display:flex;gap:7px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.cat-btn{padding:7px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--cream);font-size:12px;font-weight:700;white-space:nowrap}
.cat-btn.active{background:var(--amber);color:#1c1000;border-color:transparent}

.search-box{padding:0 16px 8px}
.search-box input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--cream);font-size:14px;outline:none;font-family:inherit}

.prods{flex:1;overflow-y:auto;padding:4px 16px 14px;display:grid;grid-template-columns:repeat(2,1fr);gap:9px;max-height:38vh;align-content:start}
.p-btn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;min-height:78px;color:var(--cream)}
.p-btn:active{transform:scale(.96);background:var(--card2)}
.p-btn .pn{font-size:13px;font-weight:700;line-height:1.25}
.p-btn .pp{font-family:'Bebas Neue';font-size:20px;color:var(--gold);margin-top:6px}

.basket{background:var(--card);border-top:1px solid var(--line);padding:12px 16px}
.basket-summary{font-size:12px;color:var(--gold);margin-bottom:8px;max-height:45px;overflow-y:auto;font-weight:600}
.b-send{width:100%;padding:14px;border-radius:12px;background:var(--green);color:#062812;font-size:15px;font-weight:800;border:none}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card2);color:var(--cream);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;z-index:100;opacity:0;transition:.3s;border:1px solid var(--green);box-shadow:0 8px 24px rgba(0,0,0,.6)}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="header">
  <div class="title">ART CITY · GARSON</div>
  <div class="garson-name" id="gName" onclick="garsonDegistir()">Garson ✏️</div>
</div>

<div class="zones" id="zones"></div>
<div class="tables" id="tables"></div>

<div class="modal" id="orderModal">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <div class="t" id="mTitle">Masa</div>
        <div class="sub" id="mSub">Mevcut Tutar: 0 ₺</div>
      </div>
      <button style="background:var(--card2);color:var(--cream);border:none;width:34px;height:34px;border-radius:10px;font-size:16px" onclick="closeOrder()">✕</button>
    </div>

    <div class="existing-order" id="existingOrderBox" style="display:none">
      <div class="existing-head">Masada Açık Olan Siparişler:</div>
      <div id="existingOrderList"></div>
    </div>

    <div class="cat-scroll" id="catTabs"></div>
    
    <div class="search-box">
      <input id="garsonSearch" placeholder="Ürün ara..." oninput="filterProds()">
    </div>

    <div class="prods" id="prodGrid"></div>

    <div class="basket" id="basketBox" style="display:none">
      <div class="basket-summary" id="bItems"></div>
      <button class="b-send" onclick="siparisGonder()">Siparişi Masaya Ekle (<span id="bTotal">0 ₺</span>)</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbzsRgrlvycvbx0ODdqK6vvpguQmXhZDbSZwJU0VCFJhdQq3DoFzb2bVdT2FZtWSzCy9/exec";

let MENU = [];
let tables = { "Ön":[{id:"Ön-1",name:"Masa 1"},{id:"Ön-2",name:"Masa 2"}], "Orta":[], "Arka":[], "Bodrum":[] };
let adisyonlar = {};
let masaAcilisZamanlari = {};
let activeZone = "Ön";
let curTable = null;
let activeCat = null;
let sepet = [];

let garson = localStorage.getItem('artcity_garson_adi') || 'Garson';
document.getElementById('gName').textContent = garson + ' ✏️';

function garsonDegistir(){
  const n = prompt('Garson Adınız:', garson);
  if(n && n.trim()){
    garson = n.trim();
    localStorage.setItem('artcity_garson_adi', garson);
    document.getElementById('gName').textContent = garson + ' ✏️';
  }
}

function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m;
  t.className='toast show';
  setTimeout(()=>t.className='toast',2000);
}

function getGecenSure(id){
  const t = masaAcilisZamanlari[id];
  if(!t) return null;
  const diff = Math.floor((Date.now() - t) / 60000);
  if(diff < 1) return "yeni";
  if(diff >= 60) return Math.floor(diff/60) + " sa " + (diff%60) + " dk";
  return diff + " dk";
}

function renderZones(){
  const zKeys = Object.keys(tables);
  if(!zKeys.includes(activeZone) && zKeys.length > 0) activeZone = zKeys[0];
  document.getElementById('zones').innerHTML = zKeys.map(z=>
    `<button class="zone ${z===activeZone?'active':''}" onclick="selZone('${z}')">${z}</button>`
  ).join('');
}
function selZone(z){ activeZone=z; renderZones(); renderTables(); }

function renderTables(){
  const list = tables[activeZone] || [];
  document.getElementById('tables').innerHTML = list.map(t=>{
    const ad = adisyonlar[t.id] || [];
    let tot = 0; ad.forEach(x=> tot += (Number(x.fiyat)||0) * (Number(x.qty)||1));
    const dolu = ad.length > 0;
    const sure = dolu ? getGecenSure(t.id) : null;

    return `
      <div class="table ${dolu?'dolu':''}" onclick="openTable('${t.id}')">
        ${sure ? `<span class="sure-badge">⏱️ ${sure}</span>` : ''}
        <span class="dot"></span>
        <span class="tn">${t.name}</span>
        ${dolu ? `<span class="ta">${tot} ₺</span>` : `<span class="empty">boş</span>`}
      </div>
    `;
  }).join('');
}

function findTable(id){
  for(const z in tables){
    const f = (tables[z]||[]).find(x=>x.id===id);
    if(f) return {...f, zone:z};
  }
  return { id:id, name:id, zone:activeZone };
}

function openTable(id){
  curTable = id;
  sepet = [];
  const t = findTable(id);
  const ad = adisyonlar[id] || [];
  let tot = 0; 
  ad.forEach(x=> tot += (Number(x.fiyat)||0) * (Number(x.qty)||1));

  document.getElementById('mTitle').textContent = t.zone + ' · ' + t.name;
  document.getElementById('mSub').textContent = (ad.length > 0) ? 'Mevcut Tutar: ' + tot + ' ₺' : 'Masa Boş';
  
  const exBox = document.getElementById('existingOrderBox');
  const exList = document.getElementById('existingOrderList');
  if(ad.length > 0){
    exBox.style.display = 'block';
    exList.innerHTML = ad.map(l=>
      `<div class="existing-line"><span>${l.qty}x ${l.urun}</span><b>${l.fiyat * l.qty} ₺</b></div>`
    ).join('');
  } else {
    exBox.style.display = 'none';
  }

  document.getElementById('garsonSearch').value = '';
  renderCatTabs();
  renderProds();
  updateBasket();
  document.getElementById('orderModal').classList.add('open');
}

function closeOrder(){ document.getElementById('orderModal').classList.remove('open'); }

function renderCatTabs(){
  const cats = [...new Set(MENU.map(m=>m.Kategori))];
  if(!activeCat && cats.length) activeCat = cats[0];
  document.getElementById('catTabs').innerHTML = cats.map(c=>
    `<button class="cat-btn ${c===activeCat?'active':''}" onclick="selCat('${c.replace(/'/g,"\\'")}')">${c}</button>`
  ).join('');
}
function selCat(c){ 
  activeCat=c; 
  document.getElementById('garsonSearch').value = '';
  renderCatTabs(); 
  renderProds(); 
}

function renderProds(){
  const q = document.getElementById('garsonSearch').value.toLocaleLowerCase('tr').trim();
  let list = MENU;

  if(q){
    list = list.filter(m => (m.Urun || '').toLocaleLowerCase('tr').includes(q));
  } else if(activeCat){
    list = list.filter(m => m.Kategori === activeCat);
  }

  document.getElementById('prodGrid').innerHTML = list.map(m=>`
    <button class="p-btn" onclick="sepeteEkle('${m.Urun.replace(/'/g,"\\'")}', ${m.Fiyat})">
      <span class="pn">${m.Urun}</span>
      <span class="pp">${m.Fiyat} ₺</span>
    </button>
  `).join('');
}

function filterProds(){ renderProds(); }

function sepeteEkle(u, f){
  const ex = sepet.find(x=>x.urun===u);
  if(ex) ex.qty++; else sepet.push({ urun:u, fiyat:Number(f)||0, qty:1 });
  updateBasket();
  toast(u + ' eklendi');
}

function updateBasket(){
  const bBox = document.getElementById('basketBox');
  if(!sepet.length){ bBox.style.display='none'; return; }
  bBox.style.display = '';
  let tot = 0;
  document.getElementById('bItems').innerHTML = sepet.map(x=>{
    tot += x.fiyat * x.qty;
    return `${x.qty}x ${x.urun} (${x.fiyat*x.qty} ₺)`;
  }).join(' · ');
  document.getElementById('bTotal').textContent = tot + ' ₺';
}

async function siparisGonder(){
  if(!sepet.length || !curTable) return;
  const t = findTable(curTable);
  
  if(!adisyonlar[curTable]){
    adisyonlar[curTable] = [];
    masaAcilisZamanlari[curTable] = Date.now();
  }

  sepet.forEach(s=>{
    const ex = adisyonlar[curTable].find(x=>x.urun===s.urun);
    if(ex) ex.qty += s.qty; else adisyonlar[curTable].push({...s});
  });

  const payload = {
    tip: 'acikSiparis',
    masa: t.zone + ' · ' + t.name,
    garson: garson,
    urunler: sepet.map(s=>({ urun: s.urun, fiyat: s.fiyat, adet: s.qty }))
  };

  fetch(SHEETS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });

  closeOrder();
  renderTables();
  toast('Sipariş masaya iletildi ✓');
}

async function senkronizeEt(){
  try {
    const res = await fetch(SHEETS_URL);
    const json = await res.json();
    if(json && json.ok){
      if(json.menu) MENU = json.menu;
      if(json.masalar) { tables = json.masalar; renderZones(); }
      if(Array.isArray(json.acik)){
        let yeni = {};
        json.acik.forEach(item=>{
          const mName = (item.masa||'').trim();
          let tid = null;
          for(const z in tables){
            const f = (tables[z]||[]).find(x=>(z+' · '+x.name).toLowerCase()===mName.toLowerCase() || x.name.toLowerCase()===mName.toLowerCase());
            if(f){ tid = f.id; break; }
          }
          if(!tid) return;
          if(!yeni[tid]){
            yeni[tid] = [];
            if(!masaAcilisZamanlari[tid]) masaAcilisZamanlari[tid] = Date.now();
          }
          const ex = yeni[tid].find(l=>l.urun===item.urun);
          if(ex) ex.qty += (item.adet||1); else yeni[tid].push({ urun:item.urun, fiyat:item.fiyat||0, qty:item.adet||1 });
        });
        
        for(const k in masaAcilisZamanlari){
          if(!yeni[k]) delete masaAcilisZamanlari[k];
        }

        adisyonlar = yeni;
        renderTables();
      }
    }
  } catch(e){}
}

renderZones();
renderTables();
senkronizeEt();
setInterval(senkronizeEt, 3500);
</script>
</body>
</html>
