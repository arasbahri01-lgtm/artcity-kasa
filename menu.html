<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Art City · Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b12;
  --bg2:#141019;
  --card:#1a1622;
  --card2:#211b2c;
  --cream:#FDF0DE;
  --amber:#FF8A1E;
  --vermilion:#F0341C;
  --gold:#FFC93C;
  --green:#22c55e;
  --purple:#7b3ff2;
  --line:rgba(255,220,180,.10);
  --glow:0 0 34px rgba(255,138,30,.28);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Sora',system-ui,sans-serif;
  background:var(--bg);
  color:var(--cream);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:100px;
}
img{display:block;max-width:100%}

/* ambient gece parıltısı */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(60% 40% at 15% 0%, rgba(240,52,28,.14), transparent 60%),
    radial-gradient(55% 45% at 90% 8%, rgba(123,63,242,.16), transparent 62%),
    radial-gradient(70% 40% at 50% 100%, rgba(255,138,30,.10), transparent 60%);
}
#app{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:0 16px 20px}

/* ===== HERO ===== */
.hero{position:relative;text-align:center;padding:30px 10px 22px}
.hero-logo{width:min(70%,270px);height:auto;margin:0 auto;filter:drop-shadow(0 12px 30px rgba(0,0,0,.6))}
.tagline{margin-top:16px;font-family:'Caveat';font-size:24px;color:var(--gold);font-weight:700}

/* ===== SEARCH ===== */
.searchwrap{position:sticky;top:0;z-index:40;padding:12px 0 12px;background:linear-gradient(180deg,var(--bg) 62%,transparent)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px 16px;transition:.2s}
.search:focus-within{border-color:var(--amber);box-shadow:var(--glow)}
.search input{flex:1;background:none;border:none;outline:none;color:var(--cream);font-size:15px;font-family:inherit}
.search input::placeholder{color:rgba(253,240,222,.4)}
.search svg{width:19px;height:19px;stroke:var(--amber);flex-shrink:0}

/* ===== KATEGORİ IZGARASI (KATMAN 1) ===== */
.grid-title{font-family:'Bebas Neue';letter-spacing:1.5px;font-size:15px;color:rgba(253,240,222,.5);margin:6px 4px 14px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.cat-card{
  position:relative;border-radius:18px;overflow:hidden;cursor:pointer;
  aspect-ratio:1/1.04;border:1px solid var(--line);
  background:var(--card);isolation:isolate;
  transition:transform .18s ease, box-shadow .18s ease;
}
.cat-card:active{transform:scale(.97)}
.cat-card .ph{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2;transform:scale(1.02);transition:transform .5s ease}
.cat-card:hover .ph{transform:scale(1.08)}
.cat-card .veil{position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg, rgba(13,11,18,.15) 0%, rgba(13,11,18,.55) 55%, rgba(13,11,18,.92) 100%);}
.cat-card.night .veil{background:linear-gradient(180deg, rgba(28,20,54,.25) 0%, rgba(28,20,54,.6) 50%, rgba(13,11,18,.94) 100%)}
.cat-card .body{position:absolute;left:0;right:0;bottom:0;padding:14px 14px 15px;display:flex;flex-direction:column;gap:3px}
.cat-card .name{font-family:'Bebas Neue';letter-spacing:.6px;font-size:23px;line-height:.98;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.cat-card .count{font-size:11px;font-weight:600;color:rgba(255,255,255,.72)}
.cat-card .accent{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--amber),var(--vermilion));z-index:1}
.cat-card.night .accent{background:linear-gradient(90deg,var(--purple),#c86bff)}

/* ===== KATEGORİ DETAY (KATMAN 2) ===== */
.detail{display:none}
.detail.active{display:block;animation:slideIn .28s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.detail-head{
  position:sticky;top:66px;z-index:30;display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-radius:16px;margin-bottom:14px;overflow:hidden;
  background:linear-gradient(120deg,var(--amber),var(--vermilion));
}
.detail.night .detail-head{background:linear-gradient(120deg,var(--purple),#b24cff)}
.detail-head .emoji{font-size:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.detail-head .t{font-family:'Caveat';font-weight:700;font-size:30px;color:#fff;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.detail-head .cnt{margin-left:auto;font-size:12px;font-weight:700;color:rgba(255,255,255,.9);background:rgba(0,0,0,.22);padding:4px 11px;border-radius:20px}
.back{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  background:var(--card);border:1.5px solid var(--line);color:var(--cream);
  font-family:inherit;font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;
  margin-bottom:14px;transition:.15s;border:none;
}
.back:active{transform:scale(.97)}
.back svg{width:16px;height:16px;stroke:var(--amber)}

/* ürün satırı */
.item{display:flex;align-items:center;gap:14px;padding:12px;border-radius:15px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;transition:.15s}
.item:active{transform:scale(.99)}
.item-img{width:64px;height:64px;flex-shrink:0;border-radius:12px;object-fit:cover;
  background:var(--card2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="%23FF8A1E" stroke-width="1.5"><circle cx="11" cy="11" r="8"/></svg>') center/22px no-repeat;}
.item-body{flex:1;min-width:0}
.item-name{font-weight:700;font-size:15px;color:var(--cream);line-height:1.25}
.item-desc{font-size:12.5px;color:rgba(253,240,222,.5);margin-top:3px;line-height:1.35}
.item-price{flex-shrink:0;font-family:'Bebas Neue';font-size:25px;letter-spacing:.5px;color:var(--gold);white-space:nowrap}
.item-price small{font-size:13px;opacity:.7;margin-left:1px}
.item-price.empty{font-size:12.5px;font-family:'Sora';color:rgba(253,240,222,.34);font-weight:600}

/* arama sonuç bloğu */
.search-cat{font-family:'Bebas Neue';letter-spacing:.8px;font-size:18px;color:var(--amber);margin:18px 4px 10px}
.empty-state{text-align:center;padding:60px 20px;color:rgba(253,240,222,.5)}
.empty-state .big{font-size:42px;margin-bottom:12px}

/* FLOATING GARSON ÇAĞIR BUTONU */
.garson-float{
  position:fixed;bottom:20px;left:16px;right:16px;z-index:45;
  display:flex;justify-content:center;
}
.garson-btn{
  width:100%;max-width:400px;padding:15px;border-radius:16px;
  background:linear-gradient(135deg,var(--amber),var(--vermilion));
  color:#fff;font-size:16px;font-weight:800;letter-spacing:.5px;border:none;cursor:pointer;
  box-shadow:0 10px 30px rgba(240,52,28,.4);display:flex;align-items:center;justify-content:center;gap:8px;
  animation:bounce 2.5s infinite;
}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-box{background:var(--card2);width:100%;max-width:380px;border-radius:20px;border:1px solid var(--line);padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-head .t{font-family:'Bebas Neue';font-size:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:rgba(253,240,222,.6);margin-bottom:6px;font-weight:700}
.field select{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;color:var(--cream);font-size:15px;outline:none;font-family:inherit}
.btn-submit{width:100%;padding:14px;border-radius:12px;background:var(--green);color:#062812;font-size:15px;font-weight:800;border:none;cursor:pointer}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--cream);padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:100;opacity:0;transition:.3s;border:1px solid var(--green);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1}

footer{position:relative;z-index:1;text-align:center;padding:34px 20px 46px;color:rgba(253,240,222,.4);font-size:12px}
footer img{width:140px;height:auto;opacity:.85;margin:0 auto 10px}
.updated{font-size:10.5px;color:rgba(253,240,222,.28);margin-top:8px}

/* ===== KAMPANYA / HAPPY HOUR ===== */
.promos{margin:2px 0 18px;display:flex;flex-direction:column;gap:10px}
.promo{
  position:relative;overflow:hidden;border-radius:16px;padding:15px 16px 15px 18px;
  background:linear-gradient(120deg,#F0341C,#B0140A);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 8px 26px rgba(240,52,28,.28);
}
.promo.happy{background:linear-gradient(120deg,#7b3ff2,#F0341C)}
.promo::after{content:"";position:absolute;top:-40%;right:-10%;width:160px;height:200px;
  background:radial-gradient(circle,rgba(255,255,255,.18),transparent 60%);pointer-events:none}
.promo-top{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.promo-badge{font-family:'Bebas Neue';letter-spacing:1px;font-size:13px;color:#111;
  background:var(--gold);padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px}
.promo-live{width:8px;height:8px;border-radius:50%;background:#111;animation:blink 1.3s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.promo-title{font-family:'Bebas Neue';letter-spacing:.6px;font-size:24px;color:#fff;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.promo-desc{font-size:13.5px;color:rgba(255,255,255,.92);margin-top:5px;line-height:1.4}
.promo-time{font-size:12px;color:rgba(255,255,255,.8);margin-top:7px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.promo-time svg{width:13px;height:13px;stroke:rgba(255,255,255,.85);fill:none}
.promo-price{margin-left:auto;font-family:'Bebas Neue';font-size:28px;letter-spacing:.5px;color:#fff;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.promo-price small{font-size:15px;opacity:.85;margin-left:1px}
.promo.soon{opacity:.92;background:linear-gradient(120deg,#3a2f52,#5a2018)}
.promo.soon.happy{background:linear-gradient(120deg,#3a2f52,#4a2560)}
.promo.soon .promo-badge{background:rgba(255,255,255,.9)}

@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>

function parseCSV(text){
  const rows=[];let i=0,f='',row=[],q=false;
  while(i<text.length){const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
    else { if(c=='"')q=true; else if(c==','){row.push(f);f='';} 
      else if(c=='\n'){row.push(f);rows.push(row);row=[];f='';}
      else if(c=='\r'){} else f+=c; }
    i++;
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows;
}

function csvToObjects(text){
  const rows=parseCSV(text).filter(r=>r.some(c=>c.trim()!==''));
  if(!rows.length)return[];
  const KEYS=["Kategori","Urun","Aciklama","Fiyat","Gorsel"];
  let head=rows[0].map(h=>h.trim());
  const merged = head[0] && head[0].indexOf('Kategori')===0 && head[0]!=='Kategori';
  if(merged){
    const firstRow = head.map((cell,i)=>{
      const prefix = KEYS[i] ? KEYS[i]+' ' : '';
      let v = cell;
      if(prefix && v.indexOf(prefix)===0) v = v.slice(prefix.length);
      else if(v===KEYS[i]) v='';
      return v.trim();
    });
    const objs=[];
    const o0={}; KEYS.forEach((k,i)=>o0[k]=(firstRow[i]||'').trim());
    if(o0.Kategori && o0.Urun) objs.push(o0);
    rows.slice(1).forEach(r=>{const o={};KEYS.forEach((k,i)=>o[k]=(r[i]||'').trim());objs.push(o);});
    return objs;
  }
  const isHeader = head[0]==='Kategori';
  const cols = isHeader ? head : KEYS;
  const body = isHeader ? rows.slice(1) : rows;
  return body.map(r=>{const o={};cols.forEach((h,i)=>o[h]=(r[i]||'').trim());return o;});
}

function money(v){
  v=(v||'').toString().trim();
  if(!v||v==='-')return '<span class="item-price empty">Sorunuz</span>';
  return '<span class="item-price">'+v+'<small>₺</small></span>';
}
function group(data){
  const g={};
  data.forEach(r=>{const k=r.Kategori||r.kategori;if(!k)return;(g[k]=g[k]||[]).push(r);});
  return g;
}
const NIGHT_CATS=["Nargile","Biralar","Alkollü İçecekler"];

let CURRENT=[], GROUPED={}, CATS=[];

function catList(g){
  const order=(typeof CAT_ORDER!=='undefined'?CAT_ORDER:Object.keys(g));
  const cats=order.filter(c=>g[c]&&g[c].length);
  Object.keys(g).forEach(c=>{if(!cats.includes(c))cats.push(c);});
  return cats;
}
function emojiFor(c){return (CAT_META[c]&&CAT_META[c].emoji)||'🍽️';}
function imgFor(c){return (typeof CAT_IMG!=='undefined'&&CAT_IMG[c])||'';}

function itemHTML(r){
  const g=(r.Gorsel||'').trim();
  const img=g?'<img class="item-img" loading="lazy" src="'+g+'" alt="">':'<div class="item-img" aria-hidden="true"></div>';
  return '<div class="item">'+img+
    '<div class="item-body"><div class="item-name">'+(r.Urun||'')+'</div>'+
    ((r.Aciklama||'').trim()?'<div class="item-desc">'+r.Aciklama+'</div>':'')+
    '</div>'+money(r.Fiyat)+'</div>';
}

/* KATMAN 1 — kategori ızgarası */
function renderGrid(){
  const main=document.getElementById('main');
  let h=renderPromos(PROMOS);
  h+='<div class="grid-title">Kategoriler · dokun ve keşfet</div><div class="grid">';
  CATS.forEach(c=>{
    const night=NIGHT_CATS.includes(c)?' night':'';
    const img=imgFor(c);
    h+='<div class="cat-card'+night+'" data-cat="'+encodeURIComponent(c)+'">'
      +'<div class="accent"></div>'
      +(img?'<div class="ph" style="background-image:url('+img+')"></div>':'')
      +'<div class="veil"></div>'
      +'<div class="body">'
      +'<div class="name">'+c+'</div>'
      +'<div class="count">'+GROUPED[c].length+' ürün</div></div></div>';
  });
  h+='</div>';
  main.innerHTML=h;
  main.querySelectorAll('.cat-card').forEach(card=>{
    card.onclick=()=>openCat(decodeURIComponent(card.dataset.cat));
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

/* KATMAN 2 — kategori detayı */
function openCat(c){
  const main=document.getElementById('main');
  const night=NIGHT_CATS.includes(c)?' night':'';
  let h='<button class="back" id="backBtn"><svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>Kategoriler</button>';
  h+='<section class="detail active'+night+'">';
  h+='<div class="detail-head"><span class="emoji">'+emojiFor(c)+'</span><span class="t">'+c+'</span><span class="cnt">'+GROUPED[c].length+'</span></div>';
  GROUPED[c].forEach(r=>h+=itemHTML(r));
  h+='</section>';
  main.innerHTML=h;
  document.getElementById('backBtn').onclick=()=>{renderGrid();};
  window.scrollTo({top:0,behavior:'smooth'});
  history.replaceState({cat:c},'');
}

/* ARAMA — tüm kategorilerde */
function renderSearch(q){
  const main=document.getElementById('main');
  const query=q.toLocaleLowerCase('tr');
  let h='', total=0;
  CATS.forEach(c=>{
    const items=GROUPED[c].filter(r=>
      (r.Urun||'').toLocaleLowerCase('tr').includes(query)||
      (r.Aciklama||'').toLocaleLowerCase('tr').includes(query)||
      c.toLocaleLowerCase('tr').includes(query));
    if(!items.length)return;
    total+=items.length;
    h+='<div class="search-cat">'+emojiFor(c)+' '+c+'</div>';
    items.forEach(r=>h+=itemHTML(r));
  });
  if(!total){
    h='<div class="empty-state"><div class="big">🔍</div>"'+q+'" için sonuç yok.<br>Başka bir şey aramayı dene.</div>';
  }
  main.innerHTML=h;
}

document.getElementById('q').addEventListener('input',e=>{
  const v=e.target.value.trim();
  if(v)renderSearch(v); else renderGrid();
});

/* ===== KAMPANYA ALTYAPISI ===== */
const KAMPANYA_URL = "https://docs.google.com/spreadsheets/d/17xu0MUfQ9gALdA9UqI234hZoS_Q1uN4_lr7BiPwENc0/gviz/tq?tqx=out:csv&sheet=Kampanyalar";
const GUN_ADI = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];

function saateDakika(s){
  s=(s||'').toString().trim();
  const m=s.match(/(\d{1,2})[:.](\d{2})/);
  if(!m)return null;
  return parseInt(m[1])*60+parseInt(m[2]);
}
function kampanyaGorunurMu(k){
  const aktif=(k.Aktif||'').toString().trim().toLocaleLowerCase('tr');
  if(aktif && ['hayır','hayir','no','kapalı','kapali','0','false'].includes(aktif))return false;
  const now=new Date();
  const gunler=(k.Gunler||'').trim();
  if(gunler){
    const bugun=GUN_ADI[now.getDay()].toLocaleLowerCase('tr');
    const liste=gunler.toLocaleLowerCase('tr').split(/[,;]/).map(x=>x.trim()).filter(Boolean);
    if(liste.length && !liste.some(g=>bugun.startsWith(g.slice(0,3))))return false;
  }
  return true;
}
function suAnAktifMi(k){
  const bas=saateDakika(k.BaslangicSaat), bit=saateDakika(k.BitisSaat);
  if(bas===null||bit===null)return true;
  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes();
  if(bas<=bit)return nowMin>=bas && nowMin<=bit;
  return nowMin>=bas || nowMin<=bit;
}
function renderPromos(list){
  const gorunur=(list||[]).filter(kampanyaGorunurMu);
  if(!gorunur.length)return '';
  let h='<div class="promos">';
  gorunur.forEach(k=>{
    const bas=(k.BaslangicSaat||'').trim(), bit=(k.BitisSaat||'').trim();
    const zamanli = bas && bit;
    const simdi = suAnAktifMi(k);
    const happy=(k.Baslik||'').toLocaleLowerCase('tr').includes('happy');
    const fiyat=(k.Fiyat||'').toString().trim();
    h+='<div class="promo'+(happy?' happy':'')+(zamanli&&!simdi?' soon':'')+'">';
    h+='<div class="promo-top"><span class="promo-badge">';
    if(zamanli && simdi) h+='<span class="promo-live"></span>ŞİMDİ AKTİF';
    else if(zamanli && !simdi) h+='⏱ BUGÜN '+bas+'\'DE';
    else h+='✦ KAMPANYA';
    h+='</span>';
    if(fiyat) h+='<span class="promo-price">'+fiyat+'<small>₺</small></span>';
    h+='</div>';
    h+='<div class="promo-title">'+(k.Baslik||'')+'</div>';
    if((k.Aciklama||'').trim())h+='<div class="promo-desc">'+k.Aciklama+'</div>';
    if(zamanli)h+='<div class="promo-time"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>Her gün '+bas+' – '+bit+' arası geçerli</div>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}
let PROMOS=[];
async function loadPromos(){
  try{
    const bust='&_t='+Date.now();
    const res=await fetch(KAMPANYA_URL+bust,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
    if(res.ok){
      const txt=await res.text();
      PROMOS=csvToObjectsGeneric(txt);
    }
  }catch(e){console.warn('Kampanyalar yüklenemedi',e);PROMOS=[];}
}

function csvToObjectsGeneric(text){
  const rows=parseCSV(text).filter(r=>r.some(c=>c.trim()!==''));
  if(!rows.length)return[];
  let head=rows[0].map(h=>h.trim());
  const merged = head[0] && head[0].indexOf('Baslik')===0 && head[0]!=='Baslik';
  let body, cols;
  if(merged){
    const KEYS=["Baslik","Aciklama","BaslangicSaat","BitisSaat","Gunler","Aktif","Fiyat"];
    const firstRow=head.map((cell,i)=>{const p=KEYS[i]?KEYS[i]+' ':'';let v=cell;if(p&&v.indexOf(p)===0)v=v.slice(p.length);else if(v===KEYS[i])v='';return v.trim();});
    const objs=[]; const o0={};KEYS.forEach((k,i)=>o0[k]=(firstRow[i]||'').trim());
    if(o0.Baslik)objs.push(o0);
    rows.slice(1).forEach(r=>{const o={};KEYS.forEach((k,i)=>o[k]=(r[i]||'').trim());objs.push(o);});
    return objs;
  }
  cols=head; body=rows.slice(1);
  return body.map(r=>{const o={};cols.forEach((h,i)=>o[h]=(r[i]||'').trim());return o;});
}

// ========== GARSON ÇAĞIRMA FONKSİYONLARI ==========
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  setTimeout(()=>t.className='toast', 2500);
}

function openCagriModal(){
  const sel = document.getElementById('masaSelect');
  let opts = '';
  for(const z in TABLES){
    (TABLES[z] || []).forEach(m => {
      opts += `<option value="${z} · ${m.name}">${z} · ${m.name}</option>`;
    });
  }
  sel.innerHTML = opts || '<option value="Masa">Masa</option>';
  document.getElementById('cagriModal').classList.add('open');
}

function closeCagriModal(){
  document.getElementById('cagriModal').classList.remove('open');
}

function cagriGonder(){
  const masa = document.getElementById('masaSelect').value;
  if(!masa) return;

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ tip: 'garsonCagir', masa: masa })
  });

  closeCagriModal();
  toast('🔔 Garsonunuza haber iletildi!');
}

async function masalariYukle(){
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    const json = await res.json();
    if(json && json.ok && json.masalar){
      TABLES = json.masalar;
    }
  } catch(e){}
}

async function boot(data){
  CURRENT=data;
  GROUPED=group(data);
  CATS=catList(GROUPED);
  await loadPromos();
  masalariYukle();
  renderGrid();
  document.getElementById('updated').textContent='Son güncelleme: '+new Date().toLocaleDateString('tr-TR');
}

(async function(){
  if(SHEET_CSV_URL){
    try{
      const bust=(SHEET_CSV_URL.includes('?')?'&':'?')+'_t='+Date.now();
      const res=await fetch(SHEET_CSV_URL+bust,{cache:'no-store',headers:{'Cache-Control':'no-cache, no-store, must-revalidate','Pragma':'no-cache'}});
      if(res.ok){
        const txt=await res.text();
        const objs=csvToObjects(txt);
        if(objs.length){boot(objs);return;}
      }
    }catch(err){console.warn('Sheets yüklenemedi, gömülü menü',err);}
  }
  boot(FALLBACK_MENU);
})();
</script>
