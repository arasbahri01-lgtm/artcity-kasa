<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Art City · Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b12;
  --bg2:#141019;
  --card:#1a1622;
  --card2:#211b2c;
  --cream:#FDF0DE;
  --amber:#FF8A1E;
  --vermilion:#F0341C;
  --gold:#FFC93C;
  --green:#22c55e;
  --purple:#7b3ff2;
  --line:rgba(255,220,180,.10);
  --glow:0 0 34px rgba(255,138,30,.28);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Sora',system-ui,sans-serif;
  background:var(--bg);
  color:var(--cream);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:110px;
}
img{display:block;max-width:100%}

body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(60% 40% at 15% 0%, rgba(240,52,28,.14), transparent 60%),
    radial-gradient(55% 45% at 90% 8%, rgba(123,63,242,.16), transparent 62%),
    radial-gradient(70% 40% at 50% 100%, rgba(255,138,30,.10), transparent 60%);
}
#app{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:0 16px 20px}

/* HERO */
.hero{position:relative;text-align:center;padding:30px 10px 18px}
.brand-title{font-family:'Bebas Neue';font-size:42px;letter-spacing:2px;color:#fff;line-height:1}
.tagline{margin-top:6px;font-family:'Caveat';font-size:24px;color:var(--gold);font-weight:700}

/* SEARCH */
.searchwrap{position:sticky;top:0;z-index:40;padding:12px 0 12px;background:linear-gradient(180deg,var(--bg) 75%,transparent)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px 16px;transition:.2s}
.search:focus-within{border-color:var(--amber);box-shadow:var(--glow)}
.search input{flex:1;background:none;border:none;outline:none;color:var(--cream);font-size:15px;font-family:inherit}
.search input::placeholder{color:rgba(253,240,222,.4)}
.search svg{width:19px;height:19px;stroke:var(--amber);flex-shrink:0}

/* GRID */
.grid-title{font-family:'Bebas Neue';letter-spacing:1.5px;font-size:16px;color:rgba(253,240,222,.5);margin:6px 4px 14px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}

.cat-card{
  position:relative;border-radius:18px;overflow:hidden;cursor:pointer;
  aspect-ratio:1/1.04;border:1px solid var(--line);
  background:var(--card);isolation:isolate;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:16px 14px;transition:transform .18s ease;
}
.cat-card:active{transform:scale(.97)}
.cat-card .emoji{font-size:36px;margin-bottom:auto}
.cat-card .name{font-family:'Bebas Neue';letter-spacing:.6px;font-size:23px;line-height:.98;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.cat-card .count{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.7);margin-top:4px}
.cat-card .accent{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--amber),var(--vermilion))}
.cat-card.night .accent{background:linear-gradient(90deg,var(--purple),#c86bff)}

/* DETAIL */
.detail{display:none}
.detail.active{display:block;animation:slideIn .25s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.detail-head{
  position:sticky;top:66px;z-index:30;display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-radius:16px;margin-bottom:14px;
  background:linear-gradient(120deg,var(--amber),var(--vermilion));
}
.detail.night .detail-head{background:linear-gradient(120deg,var(--purple),#b24cff)}
.detail-head .emoji{font-size:28px}
.detail-head .t{font-family:'Caveat';font-weight:700;font-size:30px;color:#fff;line-height:1}
.detail-head .cnt{margin-left:auto;font-size:12px;font-weight:700;color:rgba(255,255,255,.9);background:rgba(0,0,0,.25);padding:4px 11px;border-radius:20px}

.back{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  background:var(--card);border:1.5px solid var(--line);color:var(--cream);
  font-family:inherit;font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;
  margin-bottom:14px;transition:.15s;
}
.back:active{transform:scale(.97)}
.back svg{width:16px;height:16px;stroke:var(--amber)}

/* ITEM */
.item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:15px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.item-body{flex:1;min-width:0}
.item-name{font-weight:700;font-size:15px;color:var(--cream);line-height:1.25}
.item-desc{font-size:12px;color:rgba(253,240,222,.55);margin-top:4px;line-height:1.35}
.item-price{flex-shrink:0;font-family:'Bebas Neue';font-size:25px;letter-spacing:.5px;color:var(--gold);white-space:nowrap}
.item-price small{font-size:13px;opacity:.7;margin-left:1px}

/* GARSON ÇAĞIR BUTONU */
.garson-float{
  position:fixed;bottom:20px;left:16px;right:16px;z-index:45;
  display:flex;justify-content:center;
}
.garson-btn{
  width:100%;max-width:400px;padding:15px;border-radius:16px;
  background:linear-gradient(135deg,var(--amber),var(--vermilion));
  color:#fff;font-size:16px;font-weight:800;letter-spacing:.5px;border:none;cursor:pointer;
  box-shadow:0 10px 30px rgba(240,52,28,.4);display:flex;align-items:center;justify-content:center;gap:8px;
  animation:bounce 2.5s infinite;
}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-box{background:var(--card2);width:100%;max-width:380px;border-radius:20px;border:1px solid var(--line);padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-head .t{font-family:'Bebas Neue';font-size:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:rgba(253,240,222,.6);margin-bottom:6px;font-weight:700}
.field select{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;color:var(--cream);font-size:15px;outline:none;font-family:inherit}
.btn-submit{width:100%;padding:14px;border-radius:12px;background:var(--green);color:#062812;font-size:15px;font-weight:800;border:none;cursor:pointer}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--cream);padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:100;opacity:0;transition:.3s;border:1px solid var(--green);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1}

footer{position:relative;z-index:1;text-align:center;padding:24px 20px 30px;color:rgba(253,240,222,.4);font-size:12px}
</style>
</head>
<body>
<div id="app">
  <header class="hero">
    <div class="brand-title">ART CITY</div>
    <div class="tagline">Lezzet dolu anlar sizi bekliyor</div>
  </header>

  <div class="searchwrap">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Menüde ara: pizza, kahve, bira, nargile..." autocomplete="off">
    </label>
  </div>

  <main id="main"></main>
</div>

<footer>
  <div>Adana · artcitycafe</div>
  <div id="updated" style="font-size:10.5px;margin-top:6px;opacity:.6"></div>
</footer>

<div class="garson-float">
  <button class="garson-btn" onclick="openCagriModal()">🔔 Garson Çağır</button>
</div>

<div class="modal" id="cagriModal">
  <div class="modal-box">
    <div class="modal-head">
      <span class="t">🔔 Garson Çağır</span>
      <button style="background:var(--card);color:var(--cream);border:none;width:30px;height:30px;border-radius:8px;font-size:14px;cursor:pointer" onclick="closeCagriModal()">✕</button>
    </div>
    <div class="field">
      <label>Hangi Masadasınız?</label>
      <select id="masaSelect"></select>
    </div>
    <button class="btn-submit" onclick="cagriGonder()">Garsonu Çağır</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsRgrlvycvbx0ODdqK6vvpguQmXhZDbSZwJU0VCFJhdQq3DoFzb2bVdT2FZtWSzCy9/exec";

const FALLBACK_MENU = [
  {"Kategori": "Kahvaltı", "Urun": "Menemen", "Aciklama": "", "Fiyat": "300"},
  {"Kategori": "Kahvaltı", "Urun": "Kaşarlı Sucuklu Omlet", "Aciklama": "", "Fiyat": "280"},
  {"Kategori": "Kahvaltı", "Urun": "Sucuklu Tost", "Aciklama": "", "Fiyat": "160"},
  {"Kategori": "Kahvaltı", "Urun": "Kaşarlı Tost", "Aciklama": "", "Fiyat": "160"},
  {"Kategori": "Atıştırmalıklar", "Urun": "Parmak Cips", "Aciklama": "", "Fiyat": "200"},
  {"Kategori": "Atıştırmalıklar", "Urun": "Karışık Atıştırmalık", "Aciklama": "Sosis, Sigara Böreği, Soğan Halkası, Nugget, Cips", "Fiyat": "340"},
  {"Kategori": "Pizza", "Urun": "Karışık Pizza", "Aciklama": "Salam, Sosis, Sucuk, Kaşar, Biber, Mantar, Mısır", "Fiyat": "300"},
  {"Kategori": "Pizza", "Urun": "Sucuklu Pizza", "Aciklama": "Sucuk, Biber, Domates, Kaşar, Mısır", "Fiyat": "300"},
  {"Kategori": "Hamburger & Sandviç", "Urun": "Hamburger", "Aciklama": "Burger + Cips", "Fiyat": "300"},
  {"Kategori": "Hamburger & Sandviç", "Urun": "Cheeseburger Menü", "Aciklama": "Burger + Cips + Soğan Halkası + Cola", "Fiyat": "400"},
  {"Kategori": "Tavuk Yemekleri", "Urun": "Kremalı Mantarlı Tavuk", "Aciklama": "Pilav ve Cips ile servis edilir", "Fiyat": "300"},
  {"Kategori": "Tavuk Yemekleri", "Urun": "Köri Soslu Tavuk", "Aciklama": "Pilav ve Cips ile servis edilir", "Fiyat": "300"},
  {"Kategori": "Makarnalar", "Urun": "Penna Polo", "Aciklama": "Tavuk, Mantar, Krema", "Fiyat": "250"},
  {"Kategori": "Tatlılar", "Urun": "Waffle", "Aciklama": "", "Fiyat": "180"},
  {"Kategori": "Çerezler & Mezeler", "Urun": "Karışık Çerez", "Aciklama": "", "Fiyat": "200"},
  {"Kategori": "Sıcak İçecekler", "Urun": "Türk Kahvesi", "Aciklama": "", "Fiyat": "100"},
  {"Kategori": "Sıcak İçecekler", "Urun": "Filtre Kahve", "Aciklama": "", "Fiyat": "140"},
  {"Kategori": "Sıcak İçecekler", "Urun": "Çay", "Aciklama": "", "Fiyat": "45"},
  {"Kategori": "Soğuk İçecekler", "Urun": "Frozen Çilek", "Aciklama": "", "Fiyat": "170"},
  {"Kategori": "Soğuk İçecekler", "Urun": "Milkshake Çikolata", "Aciklama": "", "Fiyat": "170"},
  {"Kategori": "Kutu İçecekler", "Urun": "Cola", "Aciklama": "", "Fiyat": "90"},
  {"Kategori": "Kutu İçecekler", "Urun": "Su", "Aciklama": "", "Fiyat": "35"},
  {"Kategori": "Biralar", "Urun": "Tuborg Gold (50 cl)", "Aciklama": "", "Fiyat": "190"},
  {"Kategori": "Biralar", "Urun": "Carlsberg (50 cl)", "Aciklama": "", "Fiyat": "200"},
  {"Kategori": "Biralar", "Urun": "Bomonti", "Aciklama": "", "Fiyat": "200"},
  {"Kategori": "Alkollü İçecekler", "Urun": "Tekila Shot", "Aciklama": "", "Fiyat": "200"},
  {"Kategori": "Alkollü İçecekler", "Urun": "Viski Duble", "Aciklama": "", "Fiyat": "400"},
  {"Kategori": "Nargile", "Urun": "Çift Elma", "Aciklama": "", "Fiyat": "400"},
  {"Kategori": "Nargile", "Urun": "Love 66", "Aciklama": "", "Fiyat": "350"}
];

const CAT_EMOJIS = {
  "Kahvaltı": "🍳", "Atıştırmalıklar": "🍟", "Pizza": "🍕",
  "Hamburger & Sandviç": "🍔", "Tavuk Yemekleri": "🍗", "Makarnalar": "🍝",
  "Tatlılar": "🧇", "Çerezler & Mezeler": "🥜", "Sıcak İçecekler": "☕",
  "Bitki Çayları": "🍵", "Soğuk Çaylar": "🧊", "Soğuk İçecekler": "🥤",
  "Soğuk Kahveler": "🧋", "Kutu İçecekler": "🥫", "Alkolsüz Kokteyler": "🍹",
  "Biralar": "🍺", "Alkollü İçecekler": "🍸", "Nargile": "💨"
};

const NIGHT_CATS = ["Nargile", "Biralar", "Alkollü İçecekler"];

let MENU = FALLBACK_MENU;
let GROUPED = {};
let CATS = [];
let TABLES = { "Ön":[{name:"Masa 1"},{name:"Masa 2"},{name:"Masa 3"},{name:"Masa 4"}], "Orta":[], "Arka":[], "Bodrum":[] };

function groupMenu(data){
  const g = {};
  data.forEach(r => {
    const k = r.Kategori || "Diğer";
    if(!g[k]) g[k] = [];
    g[k].push(r);
  });
  return g;
}

function emojiFor(c){ return CAT_EMOJIS[c] || "🍽️"; }

function renderGrid(){
  const main = document.getElementById('main');
  let h = '<div class="grid-title">Kategoriler · Dokun ve Keşfet</div><div class="grid">';
  
  CATS.forEach(c => {
    const night = NIGHT_CATS.includes(c) ? ' night' : '';
    h += `
      <div class="cat-card${night}" onclick="openCat('${c.replace(/'/g,"\\'")}')">
        <div class="accent"></div>
        <div class="emoji">${emojiFor(c)}</div>
        <div class="name">${c}</div>
        <div class="count">${(GROUPED[c]||[]).length} ürün</div>
      </div>
    `;
  });
  
  h += '</div>';
  main.innerHTML = h;
  window.scrollTo({top:0, behavior:'smooth'});
}

function openCat(c){
  const main = document.getElementById('main');
  const night = NIGHT_CATS.includes(c) ? ' night' : '';
  const list = GROUPED[c] || [];

  let h = `
    <button class="back" onclick="renderGrid()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Tüm Kategoriler
    </button>
    <section class="detail active${night}">
      <div class="detail-head">
        <span class="emoji">${emojiFor(c)}</span>
        <span class="t">${c}</span>
        <span class="cnt">${list.length}</span>
      </div>
  `;

  list.forEach(r => {
    h += `
      <div class="item">
        <div class="item-body">
          <div class="item-name">${r.Urun}</div>
          ${r.Aciklama ? `<div class="item-desc">${r.Aciklama}</div>` : ''}
        </div>
        <div class="item-price">${parseInt(r.Fiyat)||0}<small>₺</small></div>
      </div>
    `;
  });

  h += '</section>';
  main.innerHTML = h;
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderSearch(q){
  const main = document.getElementById('main');
  const query = q.toLocaleLowerCase('tr').trim();
  let h = '', total = 0;

  CATS.forEach(c => {
    const items = (GROUPED[c] || []).filter(r => 
      (r.Urun || '').toLocaleLowerCase('tr').includes(query) ||
      (r.Aciklama || '').toLocaleLowerCase('tr').includes(query) ||
      c.toLocaleLowerCase('tr').includes(query)
    );
    if(!items.length) return;
    total += items.length;
    h += `<div style="font-family:'Bebas Neue';font-size:18px;color:var(--amber);margin:16px 4px 8px">${emojiFor(c)} ${c}</div>`;
    items.forEach(r => {
      h += `
        <div class="item">
          <div class="item-body">
            <div class="item-name">${r.Urun}</div>
            ${r.Aciklama ? `<div class="item-desc">${r.Aciklama}</div>` : ''}
          </div>
          <div class="item-price">${parseInt(r.Fiyat)||0}<small>₺</small></div>
        </div>
      `;
    });
  });

  if(!total){
    h = `<div style="text-align:center;padding:60px 20px;color:rgba(253,240,222,.5)"><div style="font-size:40px;margin-bottom:10px">🔍</div>"${q}" için ürün bulunamadı.</div>`;
  }
  main.innerHTML = h;
}

document.getElementById('q').addEventListener('input', e => {
  const v = e.target.value.trim();
  if(v) renderSearch(v); else renderGrid();
});

// ========== GARSON ÇAĞIRMA ==========
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  setTimeout(()=>t.className='toast', 2500);
}

function openCagriModal(){
  const sel = document.getElementById('masaSelect');
  let opts = '';
  for(const z in TABLES){
    (TABLES[z] || []).forEach(m => {
      opts += `<option value="${z} · ${m.name}">${z} · ${m.name}</option>`;
    });
  }
  sel.innerHTML = opts || '<option value="Ön · Masa 1">Ön · Masa 1</option>';
  document.getElementById('cagriModal').classList.add('open');
}

function closeCagriModal(){
  document.getElementById('cagriModal').classList.remove('open');
}

function cagriGonder(){
  const masa = document.getElementById('masaSelect').value;
  if(!masa) return;

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ tip: 'garsonCagir', masa: masa })
  });

  closeCagriModal();
  toast('🔔 Garsonunuza haber iletildi!');
}

// ========== BAŞLANGIÇ & SENKRONİZASYON ==========
function initMenu(data){
  MENU = data;
  GROUPED = groupMenu(data);
  CATS = Object.keys(GROUPED);
  renderGrid();
  document.getElementById('updated').textContent = 'Son güncelleme: ' + new Date().toLocaleDateString('tr-TR');
}

// 1. Önce hemen hazır veriyi göster
initMenu(FALLBACK_MENU);

// 2. Arka planda Google Sheets'ten güncel fiyat ve masaları çek
async function fetchOnlineMenu(){
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    const json = await res.json();
    if(json && json.ok){
      if(Array.isArray(json.menu) && json.menu.length > 0){
        initMenu(json.menu);
      }
      if(json.masalar){
        TABLES = json.masalar;
      }
    }
  } catch(e){}
}

fetchOnlineMenu();
</script>
</body>
</html>
